name: material-backend-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:54322:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:54324:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54324
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-test-only@db:5432/postgres
      GOTRUE_JWT_SECRET: local-test-jwt-secret-at-least-32-characters
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_DISABLE_SIGNUP: "false"
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.3
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:54321:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:local-test-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-test-jwt-secret-at-least-32-characters
